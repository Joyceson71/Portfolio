<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2222" />
      <stop offset="85%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#880000" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark base background -->
  <rect width="64" height="64" rx="14" fill="#080810" />

  <!-- Outer Cyber Border -->
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#CC0000" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Spider Mask Head Outline -->
  <path d="M 32 8 C 46 8 54 18 54 34 C 54 46 44 56 32 58 C 20 56 10 46 10 34 C 10 18 18 8 32 8 Z" fill="url(#spiderGlow)" filter="url(#shadow)" />

  <!-- Subtle Web Filaments on Mask -->
  <path d="M 32 8 L 32 58" stroke="#880000" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 10 34 L 54 34" stroke="#880000" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 16 18 Q 32 28 48 18" fill="none" stroke="#880000" stroke-width="1.2" />
  <path d="M 12 34 Q 32 44 52 34" fill="none" stroke="#880000" stroke-width="1.2" />
  <path d="M 18 46 Q 32 54 46 46" fill="none" stroke="#880000" stroke-width="1.2" />

  <!-- Left Spider Eye (Angular Lens) -->
  <path d="M 16 26 C 22 28 27 33 29 40 C 27 42 22 41 18 36 C 16 33 15 29 16 26 Z" fill="#080810" stroke="#0047FF" stroke-width="0.8" />
  <path d="M 17.5 27.5 C 22.5 29.5 26 33.5 27.5 39 C 26 40 22 39.5 19 35.5 C 17.5 33 17 30 17.5 27.5 Z" fill="#FFFFFF" />

  <!-- Right Spider Eye (Angular Lens) -->
  <path d="M 48 26 C 42 28 37 33 35 40 C 37 42 42 41 46 36 C 48 33 49 29 48 26 Z" fill="#080810" stroke="#0047FF" stroke-width="0.8" />
  <path d="M 46.5 27.5 C 41.5 29.5 38 33.5 36.5 39 C 38 40 42 39.5 45 35.5 C 46.5 33 47 30 46.5 27.5 Z" fill="#FFFFFF" />
</svg>
